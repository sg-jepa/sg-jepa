name: approach-original
model:
  image_size: 256
  patch_size: 16
  encoder_scale: tiny
  embed_dim: 256
  action_dim: 1
  history_size: 20
  predictor_kind: transformer
  predictor_hidden_dim: 256
  predictor_depth: 6
  predictor_heads: 16
  predictor_mlp_dim: 2048
  predictor_dim_head: 64
  predictor_dropout: 0.1
  predictor_emb_dropout: 0.0
  projector_hidden_dim: 2048
objective:
  prediction_weight: 1.0
  rollout_weight: 0.0
  rollout_horizon: 0
  rollout_gamma: 0.95
  target_detach: false
  sigreg_weight: 0.09
  sigreg_knots: 17
  sigreg_num_proj: 1024
train:
  epochs: 20
  batch_size: 32
  learning_rate: 0.00005
  muon_learning_rate: 0.0001
  weight_decay: 0.001
  muon_momentum: 0.95
  muon_ns_steps: 5
  muon_rms_match_scale: 0.4
  gradient_clip: 1.0
  gradient_accumulation_steps: 2
  seed: 3072
  precision: bf16
